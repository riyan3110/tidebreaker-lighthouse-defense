<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tidebreaker — Lighthouse Defense</title>
  <link rel="icon" href="data:," />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: #060d18;
      color: #e6f1ff;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #stage {
      position: relative;
      width: min(100vw, calc(100vh * 16 / 9));
      height: min(100vh, calc(100vw * 9 / 16));
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.85), 0 0 24px rgba(56, 189, 248, 0.15);
      background: #071324;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: crosshair;
    }
  </style>
</head>
<body>
  <div id="stage">
    <canvas id="game" width="1280" height="720"></canvas>
  </div>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
